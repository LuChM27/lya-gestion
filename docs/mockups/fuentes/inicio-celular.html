        <a href="#" style="font-size: 14px; font-weight: 800; text-decoration: none">Ver todo</a>
      </div>
      <sc-for list="{{alerts}}" as="a" hint-placeholder-count="3">
        <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #F6E6EE; text-decoration: none; color: #1F1A1D">

          <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1">
            <span style="font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.title}}</span>
            <span style="font-size: 12px; color: #6E5F67; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.detail}}</span>

    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; padding: 6px 0; color: #6E5F67; text-decoration: none; font-size: 11px; font-weight: 700">

      Inventario

    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; padding: 6px 0; color: #6E5F67; text-decoration: none; font-size: 11px; font-weight: 700">
