[project]
name = "lya-gestion"
version = "0.1.0"
description = "Sistema de gestión de L&A Tejidos"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    # 26.x ya no publica ruedas para Mac Intel; la Mac de la usuaria es x86_64.
    "argon2-cffi-bindings>=25.1,<26",
    "fastapi>=0.162.0",
    "rumps>=0.4.0 ; sys_platform == 'darwin'",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
