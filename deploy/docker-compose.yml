# Archivo de despliegue en la Mac: ~/LyA/docker-compose.yml
# Lo copia el instalador; nunca se usa la etiqueta "latest" en producción.
services:
  app:
    image: ghcr.io/luchm27/lya-gestion:1.0.0
    container_name: lya-gestion
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: America/Bogota
      DATA_DIR: /data
      BACKUP_DIR: /respaldos
    volumes:
      - lya-datos:/data
      - ${HOME}/Documents/LyA-Respaldos:/respaldos
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-m", "app.salud"]
      interval: 30s
      retries: 3

volumes:
  lya-datos:
